<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<section class="section">
  <div class="container store-layout" style="grid-template-columns:1fr 340px">
    <div>
      <h2 style="margin-top:0">بيانات التوصيل</h2>
      <div class="error-box" id="errBox"></div>
      <div class="grid-2">
        <div class="field"><label>الاسم بالكامل</label><input id="fName"></div>
        <div class="field"><label>رقم الهاتف</label><input id="fPhone"></div>
      </div>
      <div class="field"><label>العنوان بالتفصيل (المحافظة، المدينة، الشارع)</label><textarea id="fAddress" rows="3"></textarea></div>

      <h2>وسيلة الدفع</h2>
      <div id="payMethods"></div>
      <div id="payDetails" style="color:var(--ink-soft);font-size:.9rem;margin-top:-6px;margin-bottom:16px"></div>

      <button class="btn btn-gold btn-block" onclick="submitOrder()" id="submitBtn">تأكيد الطلب</button>
    </div>
    <aside class="cart-summary">
      <div id="orderItems"></div>
      <div class="summary-row"><span>الشحن</span><span id="sumShip">0 ج.م</span></div>
      <div class="summary-row total"><span>الإجمالي</span><span id="sumFinal">0 ج.م</span></div>
    </aside>
  </div>
</section>

<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/common.js"></script>
<script>
let settings, chosenMethod = '';

async function init(){
  await renderHeader();
  const cart = getCart();
  if (!cart.length) { location.href = '/cart.html'; return; }

  const user = getUser();
  if (user) {
    try { const me = await api('/auth/me', { auth: true }); document.getElementById('fName').value = me.name; document.getElementById('fPhone').value = me.phone||''; document.getElementById('fAddress').value = me.address||''; } catch(e){}
  }

  settings = await loadSettings();
  const shipFee = settings.shippingFee || 0;

  document.getElementById('orderItems').innerHTML = cart.map(c => `
    <div class="summary-row"><span>${escapeHtml(c.name)} × ${c.qty}</span><span>${money(c.price*c.qty)}</span></div>
  `).join('');
  document.getElementById('sumShip').textContent = money(shipFee);
  document.getElementById('sumFinal').textContent = money(cartTotal() + shipFee);

  const methods = [];
  const p = settings.payment || {};
  if (p.vodafoneCash && p.vodafoneCash.enabled) methods.push({ key:'vodafone', label:'فودافون كاش', detail: 'حوّل المبلغ على رقم: ' + p.vodafoneCash.number + ' ثم أكد الطلب' });
  if (p.instapay && p.instapay.enabled) methods.push({ key:'instapay', label:'إنستا باي', detail: 'حوّل المبلغ لحساب: ' + p.instapay.account + ' ثم أكد الطلب' });
  if (p.card && p.card.enabled) methods.push({ key:'card', label:'بطاقة ائتمان (أونلاين)', detail: 'سيتم تحويلك لبوابة الدفع بعد تأكيد الطلب' });
  if (p.cod && p.cod.enabled) methods.push({ key:'cod', label:'الدفع عند الاستلام' + (p.cod.fee ? ` (+${money(p.cod.fee)})` : ''), detail: 'ادفع نقداً عند استلام الطلب' });

  document.getElementById('payMethods').innerHTML = methods.map(m => `
    <label class="pay-option" id="opt-${m.key}">
      <input type="radio" name="pay" value="${m.key}" onchange="pickMethod('${m.key}','${m.detail}')">
      <span>${m.label}</span>
    </label>`).join('') || '<p style="color:var(--danger)">لا توجد وسائل دفع متاحة حالياً</p>';
}

function pickMethod(key, detail){
  chosenMethod = key;
  qsa('.pay-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('opt-'+key).classList.add('selected');
  document.getElementById('payDetails').textContent = detail;
}

async function submitOrder(){
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';

  if (!name || !phone || !address) return showErr('من فضلك أكمل كل بيانات التوصيل');
  if (!chosenMethod) return showErr('اختر وسيلة الدفع');

  const cart = getCart();
  const items = cart.map(c => ({ productId: c.productId, qty: c.qty, size: c.size, color: c.color }));

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'جاري تنفيذ الطلب...';
  try {
    const order = await api('/orders', { method:'POST', auth: !!getToken(), body: { items, paymentMethod: chosenMethod, address, phone, name } });
    clearCart();
    location.href = '/track.html?id=' + order.id;
  } catch(e){
    showErr(e.message);
    btn.disabled = false; btn.textContent = 'تأكيد الطلب';
  }
}
function showErr(msg){
  const errBox = document.getElementById('errBox');
  errBox.textContent = msg; errBox.style.display = 'block';
  errBox.scrollIntoView({behavior:'smooth'});
}
init();
</script>
</body>
</html>
