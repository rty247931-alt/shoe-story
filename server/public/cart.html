<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة المشتريات</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<section class="section">
  <div class="container">
    <div class="section-head"><div><h2>سلة المشتريات</h2></div></div>
    <div class="store-layout" id="cartLayout" style="grid-template-columns:1fr 340px">
      <div id="itemsCol"></div>
      <aside class="cart-summary">
        <div class="summary-row"><span>عدد القطع</span><span id="sumCount">0</span></div>
        <div class="summary-row"><span>الإجمالي</span><span id="sumTotal">0 ج.م</span></div>
        <div class="summary-row total"><span>المجموع</span><span id="sumFinal">0 ج.م</span></div>
        <a href="/checkout.html" class="btn btn-gold btn-block" style="margin-top:16px" id="checkoutBtn">إتمام الطلب</a>
      </aside>
    </div>
  </div>
</section>

<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/common.js"></script>
<script>
async function init(){
  await renderHeader();
  render();
}
function render(){
  const cart = getCart();
  const col = document.getElementById('itemsCol');
  if (!cart.length){
    col.innerHTML = '<div class="empty-state"><div class="icon">🛒</div>سلتك فارغة حالياً<br><a href="/store.html" class="btn btn-gold" style="margin-top:16px">تسوّق الآن</a></div>';
    document.getElementById('checkoutBtn').style.pointerEvents='none';
    document.getElementById('checkoutBtn').style.opacity=.5;
  } else {
    col.innerHTML = cart.map((c,i) => `
      <div class="cart-item">
        <img src="${c.image || ''}" onerror="this.style.display='none'">
        <div>
          <div style="font-weight:700">${escapeHtml(c.name)}</div>
          <div style="color:var(--ink-soft);font-size:.85rem;margin:4px 0">
            ${c.size ? 'مقاس: '+c.size : ''} ${c.color ? '• لون: '+escapeHtml(c.color) : ''}
          </div>
          <div class="qty-box">
            <button onclick="changeQty(${i},-1)">−</button>
            <span>${c.qty}</span>
            <button onclick="changeQty(${i},1)">+</button>
          </div>
        </div>
        <div style="text-align:left">
          <div style="font-weight:800;color:var(--gold)">${money(c.price*c.qty)}</div>
          <button class="btn btn-sm" style="color:var(--danger);border:none;background:none;margin-top:10px;cursor:pointer" onclick="removeItem(${i})">حذف</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('sumCount').textContent = cartCount();
  document.getElementById('sumTotal').textContent = money(cartTotal());
  document.getElementById('sumFinal').textContent = money(cartTotal());
}
function changeQty(i,d){ const c = getCart(); updateCartQty(i, c[i].qty+d); render(); }
function removeItem(i){ removeFromCart(i); render(); }
init();
</script>
</body>
</html>
