<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وسائل الدفع</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/admin-common.js"></script>
<script>
if (guardAdmin()) { renderAdminShell('payments', 'إدارة وسائل الدفع'); init(); }
let settings;

async function init(){
  settings = await api('/settings', { auth:true });
  const p = settings.payment;
  document.getElementById('adminContent').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h3>📱 فودافون كاش</h3>
        <label class="toggle"><input type="checkbox" id="vfEnabled" ${p.vodafoneCash.enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="field"><label>رقم فودافون كاش</label><input id="vfNumber" value="${escapeHtml(p.vodafoneCash.number||'')}"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>💠 إنستا باي</h3>
        <label class="toggle"><input type="checkbox" id="ipEnabled" ${p.instapay.enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="field"><label>حساب إنستا باي</label><input id="ipAccount" value="${escapeHtml(p.instapay.account||'')}"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>💳 بطاقة ائتمان (Paymob)</h3>
        <label class="toggle"><input type="checkbox" id="cardEnabled" ${p.card.enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="grid-2">
        <div class="field"><label>Paymob API Key</label><input id="cardApiKey" value="${escapeHtml(p.card.apiKey||'')}" placeholder="اختياري - يُستخدم عند الربط الفعلي"></div>
        <div class="field"><label>Integration ID</label><input id="cardIntId" value="${escapeHtml(p.card.integrationId||'')}"></div>
      </div>
      <p style="color:var(--ink-soft);font-size:.85rem">لتفعيل الدفع الفعلي بالبطاقة تحتاج حساب Paymob موثق وربط الـ API الخاص بهم من لوحة تحكمهم.</p>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>💵 الدفع عند الاستلام</h3>
        <label class="toggle"><input type="checkbox" id="codEnabled" ${p.cod.enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="field"><label>رسوم إضافية (اختياري)</label><input id="codFee" type="number" value="${p.cod.fee||0}"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>🚚 رسوم الشحن الأساسية</h3></div>
      <div class="field"><label>رسوم التوصيل لكل الطلبات (ج.م)</label><input id="shippingFee" type="number" value="${settings.shippingFee||0}"></div>
    </div>

    <button class="btn btn-gold" onclick="save()">حفظ إعدادات الدفع</button>
  `;
}

async function save(){
  const body = {
    shippingFee: Number(document.getElementById('shippingFee').value)||0,
    payment: {
      vodafoneCash: { enabled: document.getElementById('vfEnabled').checked, number: document.getElementById('vfNumber').value.trim() },
      instapay: { enabled: document.getElementById('ipEnabled').checked, account: document.getElementById('ipAccount').value.trim() },
      card: { enabled: document.getElementById('cardEnabled').checked, provider:'Paymob', apiKey: document.getElementById('cardApiKey').value.trim(), integrationId: document.getElementById('cardIntId').value.trim() },
      cod: { enabled: document.getElementById('codEnabled').checked, fee: Number(document.getElementById('codFee').value)||0 }
    }
  };
  try {
    await api('/settings', { method:'PUT', auth:true, body });
    toast('تم حفظ إعدادات الدفع بنجاح');
  } catch(e){ toast(e.message, true); }
}
</script>
</body>
</html>
