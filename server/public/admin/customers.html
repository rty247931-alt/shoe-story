<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العملاء</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/admin-common.js"></script>
<script>
if (guardAdmin()) { renderAdminShell('customers', 'إدارة العملاء'); init(); }

async function init(){
  document.getElementById('adminContent').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>عدد الطلبات</th><th>إجمالي المشتريات</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  `;
  load();
}

async function load(){
  const customers = await api('/customers', { auth:true });
  document.getElementById('rows').innerHTML = customers.map(c => `
    <tr>
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td>${escapeHtml(c.phone||'—')}</td>
      <td>${c.ordersCount}</td>
      <td>${money(c.totalSpent)}</td>
      <td>${c.banned ? '<span class="status-pill status-ملغي">محظور</span>' : '<span class="status-pill status-مكتمل">نشط</span>'}</td>
      <td><button class="btn btn-sm ${c.banned?'btn-outline':'btn-danger'}" onclick="toggleBan('${c.id}', ${!c.banned})">${c.banned?'إلغاء الحظر':'حظر'}</button></td>
    </tr>`).join('') || '<tr><td colspan="7"><div class="empty-state">لا يوجد عملاء بعد</div></td></tr>';
}

async function toggleBan(id, banned){
  await api('/customers/'+id+'/ban', { method:'PUT', auth:true, body:{ banned } });
  toast(banned ? 'تم حظر العميل' : 'تم إلغاء الحظر');
  load();
}
</script>
</body>
</html>
