<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.product-view{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.gallery-main{aspect-ratio:1/1;background:var(--bg-soft);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:5rem;color:var(--line)}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-thumbs{display:flex;gap:10px;margin-top:12px}
.gallery-thumbs img{width:70px;height:70px;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:pointer}
.gallery-thumbs img.active{border-color:var(--gold)}
@media(max-width:900px){.product-view{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<section class="section">
  <div class="container product-view" id="view"></div>
</section>

<section class="section" style="background:var(--bg-soft)">
  <div class="container">
    <div class="section-head"><div><h2>قد يعجبك أيضاً</h2></div></div>
    <div class="products-grid" id="related"></div>
  </div>
</section>

<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let product, chosenSize='', chosenColor='';

async function init(){
  await renderHeader('store');
  if (!id) { document.getElementById('view').innerHTML = '<p>منتج غير موجود</p>'; return; }
  try {
    product = await api('/products/' + id);
  } catch(e){
    document.getElementById('view').innerHTML = '<p>المنتج غير موجود</p>';
    return;
  }
  document.title = product.name;
  render();
  loadRelated();
}

function render(){
  const images = product.images && product.images.length ? product.images : [];
  document.getElementById('view').innerHTML = `
    <div>
      <div class="gallery-main" id="mainImg">${images[0] ? `<img src="${images[0]}">` : '👟'}</div>
      ${images.length > 1 ? `<div class="gallery-thumbs">${images.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="switchImg('${im}', this)">`).join('')}</div>` : ''}
    </div>
    <div>
      <h1 style="font-size:1.8rem;font-weight:800;margin:0 0 10px">${escapeHtml(product.name)}</h1>
      <div class="price-row" style="font-size:1.3rem;margin-bottom:18px">
        <span class="price">${money(product.discountPrice || product.price)}</span>
        ${product.discountPrice ? `<span class="price-old">${money(product.price)}</span>` : ''}
      </div>
      <p style="color:var(--ink-soft);margin-bottom:24px">${escapeHtml(product.description || '')}</p>

      ${product.sizes && product.sizes.length ? `
      <div style="margin-bottom:20px">
        <div style="font-weight:700;margin-bottom:8px">المقاس</div>
        <div class="chip-row" id="sizeChips">
          ${product.sizes.map(s=>`<span class="chip" data-v="${s}" onclick="pickSize('${s}')">${s}</span>`).join('')}
        </div>
      </div>` : ''}

      ${product.colors && product.colors.length ? `
      <div style="margin-bottom:26px">
        <div style="font-weight:700;margin-bottom:8px">اللون</div>
        <div class="chip-row" id="colorChips">
          ${product.colors.map(c=>`<span class="chip" data-v="${c}" onclick="pickColor('${c}')">${escapeHtml(c)}</span>`).join('')}
        </div>
      </div>` : ''}

      <div class="qty-box" style="margin-bottom:22px">
        <button onclick="changeQty(-1)">−</button>
        <span id="qtyVal">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>

      <button class="btn btn-gold btn-block" onclick="addNow()">أضف إلى السلة</button>
    </div>
  `;
}

let qty = 1;
function changeQty(d){ qty = Math.max(1, qty + d); document.getElementById('qtyVal').textContent = qty; }
function switchImg(src, el){ document.getElementById('mainImg').innerHTML = `<img src="${src}">`; qsa('.gallery-thumbs img').forEach(i=>i.classList.remove('active')); el.classList.add('active'); }
function pickSize(s){ chosenSize = s; qsa('#sizeChips .chip').forEach(c=>c.classList.toggle('selected', c.dataset.v===s)); }
function pickColor(c){ chosenColor = c; qsa('#colorChips .chip').forEach(el=>el.classList.toggle('selected', el.dataset.v===c)); }

function addNow(){
  if (product.sizes && product.sizes.length && !chosenSize) return toast('اختر المقاس أولاً', true);
  if (product.colors && product.colors.length && !chosenColor) return toast('اختر اللون أولاً', true);
  addToCart({
    productId: product.id, name: product.name, image: (product.images||[])[0]||'',
    price: product.discountPrice || product.price, size: chosenSize, color: chosenColor, qty
  });
  toast('تمت الإضافة إلى السلة 🛒');
}

async function loadRelated(){
  const all = await api('/products?category=' + (product.categoryId||''));
  const rel = all.filter(p=>p.id!==product.id).slice(0,4);
  document.getElementById('related').innerHTML = rel.map(p => `
    <a class="product-card" href="/product.html?id=${p.id}">
      <div class="product-thumb">${(p.images||[])[0] ? `<img src="${p.images[0]}">` : '👟'}</div>
      <div class="product-info"><h3>${escapeHtml(p.name)}</h3>
      <div class="price-row"><span class="price">${money(p.discountPrice||p.price)}</span></div></div>
    </a>`).join('') || '<p style="color:var(--ink-soft)">لا توجد منتجات مشابهة</p>';
}

init();
</script>
</body>
</html>
