<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<section class="section">
  <div class="container">
    <div class="form-card">
      <h2 style="text-align:center;margin-top:0">إنشاء حساب جديد</h2>
      <div class="error-box" id="errBox"></div>
      <div class="field"><label>الاسم بالكامل</label><input id="name"></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
      <div class="field"><label>رقم الهاتف</label><input id="phone"></div>
      <div class="field"><label>كلمة السر</label><input id="password" type="password"></div>
      <button class="btn btn-gold btn-block" onclick="doRegister()">إنشاء الحساب</button>
      <div class="form-foot">لديك حساب بالفعل؟ <a href="/login.html" style="color:var(--gold);font-weight:700">سجل الدخول</a></div>
    </div>
  </div>
</section>

<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/common.js"></script>
<script>
renderHeader();
async function doRegister(){
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('errBox');
  errBox.style.display='none';
  try {
    const data = await api('/auth/register', { method:'POST', body:{ name, email, phone, password } });
    setToken(data.token); setUser(data.user);
    location.href = '/account.html';
  } catch(e){
    errBox.textContent = e.message; errBox.style.display='block';
  }
}
</script>
</body>
</html>
