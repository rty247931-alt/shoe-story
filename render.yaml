services:
  - type: web
    name: shoe-store
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: STORAGE_DIR
        value: /var/data
    disk:
      name: shoe-store-storage
      mountPath: /var/data
      sizeGB: 1
