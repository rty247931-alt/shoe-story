<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأقسام</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/admin-common.js"></script>
<script>
if (guardAdmin()) { renderAdminShell('categories', 'إدارة الأقسام'); init(); }
let editingId = null;
let formImage = '';

async function init(){
  document.getElementById('adminContent').innerHTML = `
    <div class="panel-head" style="margin-bottom:18px">
      <div></div>
      <button class="btn btn-gold" onclick="openForm()">+ إضافة قسم جديد</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الصورة</th><th>الاسم</th><th>الترتيب</th><th>إجراءات</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="modal-overlay" id="modal">
      <div class="modal-box">
        <h3 id="modalTitle">إضافة قسم</h3>
        <div class="field"><label>اسم القسم</label><input id="fName"></div>
        <div class="field"><label>ترتيب العرض</label><input id="fOrder" type="number" value="1"></div>
        <div class="field">
          <label>صورة القسم</label>
          <input type="file" id="fileInput" accept="image/*" onchange="uploadImg(this.files)">
          <div class="img-thumb-row" id="imgThumbs"></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button class="btn btn-gold btn-block" onclick="saveCat()">حفظ</button>
          <button class="btn btn-outline" onclick="closeForm()">إلغاء</button>
        </div>
      </div>
    </div>
  `;
  load();
}

async function load(){
  const cats = await api('/categories');
  document.getElementById('rows').innerHTML = cats.map(c => `
    <tr>
      <td><div style="width:46px;height:46px;border-radius:3px;overflow:hidden;background:var(--bg-soft)">${c.image?`<img src="${c.image}" style="width:100%;height:100%;object-fit:cover">`:''}</div></td>
      <td>${escapeHtml(c.name)}</td>
      <td>${c.order}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick='openForm(${JSON.stringify(c).replace(/'/g,"&apos;")})'>تعديل</button>
        <button class="btn btn-sm btn-danger" onclick="del('${c.id}')">حذف</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="4"><div class="empty-state">لا توجد أقسام بعد</div></td></tr>';
}

function openForm(c){
  editingId = c ? c.id : null;
  document.getElementById('modalTitle').textContent = c ? 'تعديل قسم' : 'إضافة قسم';
  document.getElementById('fName').value = c ? c.name : '';
  document.getElementById('fOrder').value = c ? c.order : 1;
  formImage = c ? (c.image||'') : '';
  renderThumb();
  document.getElementById('modal').classList.add('open');
}
function closeForm(){ document.getElementById('modal').classList.remove('open'); }

async function uploadImg(files){
  const fd = new FormData();
  fd.append('images', files[0]);
  try {
    const res = await api('/upload', { method:'POST', auth:true, isForm:true, body: fd });
    formImage = res.urls[0];
    renderThumb();
  } catch(e){ toast(e.message, true); }
}
function renderThumb(){
  document.getElementById('imgThumbs').innerHTML = formImage ? `<div class="img-thumb"><img src="${formImage}"><button onclick="formImage='';renderThumb()">✕</button></div>` : '';
}

async function saveCat(){
  const body = { name: document.getElementById('fName').value.trim(), order: Number(document.getElementById('fOrder').value)||1, image: formImage };
  if (!body.name) return toast('اسم القسم مطلوب', true);
  try {
    if (editingId) await api('/categories/'+editingId, { method:'PUT', auth:true, body });
    else await api('/categories', { method:'POST', auth:true, body });
    toast('تم الحفظ'); closeForm(); load();
  } catch(e){ toast(e.message, true); }
}
async function del(id){
  if (!confirm('هل تريد حذف هذا القسم؟')) return;
  await api('/categories/'+id, { method:'DELETE', auth:true });
  toast('تم الحذف'); load();
}
</script>
</body>
</html>
